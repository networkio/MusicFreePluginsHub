name: Setup Python
description: Setup Python

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true

    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        # pythonmonkey 依赖有预编译轮子，锁定 3.12 避免 GitHub Actions 自动选用
        # 3.13/3.14 等预发布版本触发源码编译失败
        python-version: "3.12"
